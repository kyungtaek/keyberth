<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyberth</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="device.css"></head>
<body><header><div class="brand"><i aria-hidden="true"></i>Keyberth</div><nav aria-label="화면"><button data-view="mapping">키 매핑</button><button data-view="sessions">최근 세션</button><button data-view="device">기기 설정</button></nav><span id="activeName" class="host"></span></header>
<main><section id="mapping" class="mapping"><div class="canvas"><div class="section-title"><h1>AI Micro<span>.</span></h1><small>Universal Agent / 0.2.18</small><div class="profileControls"><select id="profile" aria-label="활성 앱 키맵"></select><button id="auto" aria-pressed="false" title="노브 클릭으로 전환">자동 전환 끔</button></div></div><div class="stage"><div id="board" class="board" role="group" aria-label="AI Micro 키 배열"></div></div></div>
<aside><div class="section-title"><span class="legend">선택한 입력</span><h2 id="keyTitle"></h2><code id="keyId"></code></div><div class="modes"><button id="actionMode">동작</button><button id="chordMode">단축키</button><button id="noteMode" hidden>문서</button></div>
<div id="actionFields"><label for="category">동작 그룹</label><select id="category"></select><div id="actionList" role="group" aria-label="할당할 동작"></div></div>
<div id="noteFields" hidden><label>열 문서</label><strong id="noteTitle"></strong> <button id="chooseNote" class="ghost">문서 선택…</button></div>
<div id="chordFields" hidden><label>함께 누를 키</label><div id="mods" class="mods"></div><label for="base">기본 키</label><select id="base"></select><output id="chord"></output></div>
<div class="editFoot"><div class="current"><span>현재 배정</span><strong id="current"></strong></div><div class="actions"><button class="ghost" id="restore">기본값 복원</button><button class="primary" id="save">저장</button></div></div></aside></section>
<section id="sessions" class="simple" hidden><div class="section-title"><h1>최근 세션<span>.</span></h1><button class="ghost" id="openEditor">키 매핑 ↗</button></div><div id="slots"></div></section>
<section id="device" class="simple" hidden><div class="section-title"><h1>기기 설정<span>.</span></h1><small>AI Micro</small></div><div class="pref"><label for="sleep">자동 절전 <small>0분이면 끔</small></label><div><input id="sleep" type="number" min="0" max="120" step="1"> 분</div></div><div class="pref"><label for="volume">부저 볼륨</label><div><input id="volume" type="range" min="0" max="100"><output id="volumeText"></output></div></div><p id="buzzer"></p><div class="actions"><button id="readPrefs" class="ghost">다시 읽기</button><button id="savePrefs" class="primary">기기에 저장</button></div>
<section id="lighting"><h2>세션 조명</h2><label for="lightState">세션 상태</label><select id="lightState"></select>
<div id="lightZones"></div>
<p class="legend">바닥 조명은 선택된 세션을 따릅니다. 선택이 없으면 입력 요청, 실행 중, 완료 순으로 표시합니다.</p>
<div class="actions"><small id="lightStatus" role="status"></small><button id="saveLight" class="primary" disabled>조명 저장</button></div></section></section></main>
<footer><div id="usb"></div><div id="cmux"></div><button id="connect">다시 연결</button></footer><div id="notice" role="status" aria-live="polite"></div><script src="renderer.js"></script></body></html>
