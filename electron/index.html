<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyberth</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="device.css"><link rel="stylesheet" href="workspace.css"></head>
<body><header><div class="brand"><i aria-hidden="true"></i>Keyberth</div><nav aria-label="화면"><button data-view="mapping">키 매핑</button><button data-view="sessions">최근 세션</button><button data-view="device">기기 설정</button></nav><span id="activeName" class="host"></span></header>
<main><div class="canvas"><div class="section-title"><h1>AI Micro<span>.</span></h1><small>Universal Agent / 0.2.18</small><div class="profileControls"><div id="scopesBar" class="pills" role="group" aria-label="편집 범위"></div><select hidden id="scope" aria-label="편집할 키 레이어"><option value="global">글로벌 기본</option><option value="app">앱별 예외</option></select><div id="appEditor" hidden><label for="profile">예외를 편집할 프로세스</label><select id="profile"></select><small id="overrideCount"></small></div></div></div><div class="stage"><div class="deviceFrame"><div id="underglow" class="lamp" aria-hidden="true"></div><div id="board" class="board" role="group" aria-label="AI Micro 키 배열"></div></div></div><small id="previewCaption" hidden></small></div>
<aside id="mapping"><div class="section-title"><span class="legend">선택한 입력</span><h2 id="keyTitle"></h2><code id="keyId"></code></div><div class="layerTools"><button id="inherit" class="ghost">글로벌 설정 따르기</button></div><div class="modes"><button id="actionMode">동작</button><button id="chordMode">단축키</button><button id="noteMode" hidden>문서</button></div>
<div id="actionFields"><select id="category" hidden aria-label="동작 그룹"></select><div class="functionTools"><input type="search" id="functionSearch" aria-label="전체 기능 검색" placeholder="전체 기능 검색"><button id="reloadMenus" class="ghost" title="실행 중인 앱의 메뉴 다시 읽기">새로고침</button></div><div class="library"><div id="groupBar" class="groupBar" role="group" aria-label="동작 그룹"></div><div class="results"><button id="manageFavorites" class="ghost" hidden>즐겨찾는 앱 관리…</button><div id="actionList" role="group" aria-label="할당할 동작"></div><p id="noActions" hidden>표시할 기능이 없습니다.</p></div></div></div>
<div id="noteFields" hidden><label>열 문서</label><strong id="noteTitle"></strong> <button id="chooseNote" class="ghost">문서 선택…</button></div>
<div id="chordFields" hidden><label>함께 누를 키</label><div id="mods" class="mods"></div><label for="base">기본 키</label><select id="base" hidden></select><div id="baseGrid" aria-label="기본 키"></div><output id="chord"></output></div>
<div class="editFoot"><div class="current"><span>현재 배정</span><strong id="current"></strong></div><div class="actions"><button class="ghost" id="restore">기본값 복원</button><button class="primary" id="save">저장</button></div></div></aside>
<section id="sessions" class="simple" hidden><div class="section-title"><h1>최근 세션<span>.</span></h1><button class="ghost" id="openEditor">키 매핑 ↗</button></div><div id="slots"></div><details id="claudeSlots" hidden><summary>Claude Code 슬롯 설정</summary><div id="claudeSlotFields"></div></details></section>
<section id="device" class="simple" hidden><div class="section-title"><h1>기기 설정<span>.</span></h1><small>AI Micro</small></div><div class="settingTabs" role="group" aria-label="설정 분류"><button data-panel="hardware">기기</button><button data-panel="lighting">세션 조명</button><button data-panel="apps">앱 관리</button><button data-panel="files">백업 · 연동</button></div><section id="hardware" class="settingPanel"><div class="pref"><strong>포커스된 앱의 키맵 자동 적용</strong><button id="auto" aria-pressed="false" title="포커스된 앱에 맞춰 자동 전환">자동 전환 끔</button></div><div class="pref"><label for="sleep">자동 절전 <small>0분이면 끔</small></label><div><input id="sleep" type="number" min="0" max="120" step="1"> 분</div></div><div class="pref"><label for="volume">부저 볼륨</label><div><input id="volume" type="range" min="0" max="100"><output id="volumeText"></output></div></div><p id="buzzer"></p><div class="actions"><button id="readPrefs" class="ghost">다시 읽기</button><button id="savePrefs" class="primary">기기에 저장</button></div>
</section><section id="apps" class="settingPanel" hidden><div class="pref"><label for="manageProfile">앱 키맵</label><div class="actions"><select size="7" id="manageProfile"></select><button class="ghost" id="addProfile">추가…</button><button class="ghost" id="removeProfile">삭제…</button></div></div><div class="pref"><label for="favoriteApp">즐겨찾는 앱</label><div class="actions"><select size="7" id="favoriteApp" aria-label="즐겨찾거나 실행 중인 앱"></select><button id="addFavorite">추가</button><button id="removeFavorite">제거</button></div></div>
</section><section id="files" class="settingPanel" hidden><div class="pref"><strong>키맵 파일</strong><div class="actions"><button id="importMaps">JSON 가져오기…</button><button id="exportMaps">JSON 내보내기…</button></div></div>
<div class="pref"><strong>Claude Code 세션 훅</strong><div class="actions"><button id="installClaudeHooks">연결</button><button id="removeClaudeHooks">해제</button></div></div>
</section><section id="lighting" class="settingPanel" hidden><h2>세션 상태</h2><div id="lightBar" class="pills" role="group" aria-label="세션 상태"></div><select hidden id="lightState"></select>
<div id="lightZones"></div>
<p class="legend">바닥 조명은 선택된 세션을 따릅니다. 선택이 없으면 입력 요청, 실행 중, 완료 순으로 표시합니다.</p>
<div class="actions"><small id="lightStatus" role="status"></small><button id="saveLight" class="primary" disabled>조명 저장</button></div></section></section></main>
<footer><div id="usb"></div><div id="cmux"></div><button id="connect">다시 연결</button></footer><div id="notice" role="status" aria-live="polite"></div><script src="renderer.js"></script></body></html>
