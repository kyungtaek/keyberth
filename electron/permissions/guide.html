<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="guide.css">
  <title>Keyberth 권한 안내</title>
</head>
<body>
  <header>Keyberth</header>
  <main>
    <h1>손쉬운 사용을 켜 주세요</h1>
    <p>Keyberth가 키 입력을 다른 앱에 전달하고 대화의 버튼을 조작하는 데 필요합니다.</p>
    <figure>
      <img src="accessibility-guide.svg" width="536" height="136" alt="시스템 설정의 손쉬운 사용 목록에서 Keyberth 오른쪽 스위치가 켜진 예시">
      <figcaption>시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용</figcaption>
    </figure>
    <p>목록에서 <b>Keyberth</b>를 켜세요. 목록에 없으면 <b>＋</b>를 눌러 실행 중인 앱을 추가하세요.</p>
    <div role="status" aria-live="polite"></div>
  </main>
  <footer>
    <button data-action="later">나중에</button>
    <button data-action="check">다시 확인</button>
    <button class="primary" data-action="open">시스템 설정 열기</button>
  </footer>
</body>
</html>
